name: Build RMX2001 kernel

on:
  push:
    branches: [droidian]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmx2001-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build via the official Droidian pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and collect artifacts
        shell: bash
        env:
          COLLECTION: ${{ runner.temp }}/rmx2001-upload
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/rmx2001-build"
          ./build.sh --jobs "$(nproc)" --output "$OUTPUT_DIR"

          mapfile -t builds < <(find "$OUTPUT_DIR" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#builds[@]}" -eq 1
          build_dir=${builds[0]}
          (cd "$build_dir" && sha256sum --check SHA256SUMS)

          test -s "$build_dir/boot.img"
          test -s "$build_dir/kernel-Image"
          test -s "$build_dir/MANIFEST.txt"
          mapfile -t bootpkgs < <(find "$build_dir" -maxdepth 1 -type f -name 'linux-bootimage-4.14.141-realme-rmx2001_*_arm64.deb' -print)
          test "${#bootpkgs[@]}" -eq 1

          mkdir -p "$COLLECTION"
          cp "$build_dir"/*.deb "$build_dir"/*.changes "$build_dir"/*.buildinfo \
            "$build_dir/boot.img" "$build_dir/kernel-Image" "$build_dir/MANIFEST.txt" \
            "$build_dir/package-info.txt" "$build_dir/package-contents.txt" \
            "$build_dir/compiler.version" "$build_dir/linux-packaging-snippets.version" \
            "$COLLECTION/"
          (cd "$COLLECTION" && sha256sum *.deb boot.img kernel-Image MANIFEST.txt \
            package-info.txt package-contents.txt compiler.version \
            linux-packaging-snippets.version > SHA256SUMS)
          cat "$build_dir/MANIFEST.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload boot image and Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: rmx2001-kernel-${{ github.sha }}
          path: ${{ runner.temp }}/rmx2001-upload/
          if-no-files-found: error
          retention-days: 14
